services:
  # Base de datos MySQL para el servicio de web scraping
  mysql-scraper:
    image: mysql:8.0
    container_name: book_scraper_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"  # Puerto externo definido en .env
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_scraper_data:/var/lib/mysql
    networks:
      - bookworm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Servicio de web scraping de precios de libros
  book-scraper:
    build: .
    container_name: book_scraper_service
    environment:
      # Configuración de base de datos (apunta al servicio mysql-scraper)
      - DB_HOST=mysql-scraper
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      
      # Configuración del servidor
      - PORT=${PORT}
      - GIN_MODE=${GIN_MODE}
      
      # Configuración de scraping
      - SCRAPING_TIMEOUT=${SCRAPING_TIMEOUT}
      - USER_AGENT=${USER_AGENT}
      - MAX_RETRIES=${MAX_RETRIES}
      - SCRAPING_SOURCES=${SCRAPING_SOURCES}
      - BUSCALIBRE_BASE_URL=${BUSCALIBRE_BASE_URL}
      - PANAMERICANA_BASE_URL=${PANAMERICANA_BASE_URL}
      - CASADELLIBRO_BASE_URL=${CASADELLIBRO_BASE_URL}
    ports:
      - "${PORT}:${PORT}"  # Puerto definido en .env
    depends_on:
      mysql-scraper:
        condition: service_healthy
    networks:
      - bookworm_network
    restart: unless-stopped

volumes:
  mysql_scraper_data:

networks:
  bookworm_network:
    external: true
    name: bookworm_network