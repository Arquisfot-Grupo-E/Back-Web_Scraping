services:
  # Base de datos MySQL para el servicio de web scraping
  mysql-scraper:
    image: mysql:8.0
    container_name: book_scraper_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: book_prices
      MYSQL_USER: scraper
      MYSQL_PASSWORD: scraperpass
    ports:
      - "3312:3306"  # Puerto externo 3312 para desarrollo individual
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_scraper_data:/var/lib/mysql
    networks:
      - data_network  # Solo en red de datos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Servicio de web scraping de precios de libros
  book-scraper:
    build: .
    container_name: book_scraper_service
    environment:
      # Configuración de base de datos
      - DB_HOST=mysql-scraper
      - DB_PORT=3306
      - DB_USER=scraper
      - DB_PASSWORD=scraperpass
      - DB_NAME=book_prices
      
      # Configuración del servidor
      - PORT=8080
      - GIN_MODE=release
      
      # Configuración de scraping
      - SCRAPING_TIMEOUT=30
      - USER_AGENT=BookScraper/1.0
      - MAX_RETRIES=3
      - SCRAPING_SOURCES=buscalibre,panamericana
      - BUSCALIBRE_BASE_URL=https://www.buscalibre.com.co
      - PANAMERICANA_BASE_URL=https://www.panamericana.com.co

      # Configuración de Kafka
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=recommendation-scrapping

    ports:
      - "8080:8080"
    depends_on:
      mysql-scraper:
        condition: service_healthy
    networks:
      - backend_network  # Recibe peticiones del gateway
      - data_network     # Accede a MySQL y Kafka
    restart: unless-stopped

volumes:
  mysql_scraper_data:

# =============================================================================
# REDES SEGMENTADAS
# =============================================================================
# Back-Web_Scraping:
#   - backend_network: Recibe peticiones del gateway
#   - data_network: Accede a MySQL y Kafka
#
# MySQL:
#   - data_network: Red aislada de datos
#
# PREREQUISITO: Ejecutar bash scripts/setup-networks.sh (en Middleware-Graphql)
# =============================================================================
networks:
  backend_network:
    external: true
    name: backend_network
  
  data_network:
    external: true
    name: data_network